version = 1

# REUSE configuration for the ownCloud Desktop Client.
# https://reuse.software/spec/
#
# Per-file SPDX headers are the primary source of licensing information for
# source code. This file covers assets and generated/config files that cannot
# carry a comment header, and records the licensing of bundled third-party
# material. More specific entries below override the general ones above them.

# --- Project-owned assets and build/config files (GPL-2.0-or-later) ----------

[[annotations]]
path = [
  "changelog/**",
  "**/CMakeLists.txt",
  "**.cmake",
  "**.cmake.in",
  "**.in",
  "**.ui",
  "**.qrc",
  "**.qrc.in",
  "**.qss",
  "**.desktop.in",
  "**.rc",
  "**.manifest",
  "**.plist",
  "**.entitlements",
  "**.def",
  "**.json",
  "**.json.in",
  "**.html",
  "**.lst",
]
SPDX-FileCopyrightText = "ownCloud GmbH"
SPDX-License-Identifier = "GPL-2.0-or-later"

# Icons and images shipped as part of the application UI.
[[annotations]]
path = [
  "src/resources/**.svg",
  "src/resources/**.png",
  "src/resources/**.ico",
  "src/resources/**.icns",
  "admin/**.svg",
  "admin/**.png",
  "shell_integration/**.png",
  "shell_integration/**.svg",
  "shell_integration/**.ico",
  "shell_integration/**.icns",
]
SPDX-FileCopyrightText = "ownCloud GmbH"
SPDX-License-Identifier = "GPL-2.0-or-later"

# Translations (generated/maintained from the source strings).
[[annotations]]
path = ["translations/**.ts"]
SPDX-FileCopyrightText = "ownCloud GmbH"
SPDX-License-Identifier = "GPL-2.0-or-later"

# Test suite: python harness, BDD feature files, and test fixtures/data.
[[annotations]]
path = [
  "test/**.py",
  "test/**.feature",
  "test/**.ini",
  "test/**.conf",
  "test/**.pro",
  "test/**.sh",
  "test/**.json",
