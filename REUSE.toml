  "test/**.jpg",
  "test/**.jpeg",
  "test/**.pdf",
  "test/**.mp3",
  "test/**.mp4",
]
SPDX-FileCopyrightText = "ownCloud GmbH"
SPDX-License-Identifier = "GPL-2.0-or-later"

# Repository documentation and top-level project files.
[[annotations]]
path = [
  "README.md",
  "CONTRIBUTING.md",
  "CHANGELOG.md",
  "PACKAGING.md",
  ".github/**.md",
  "src/**.md",
  "test/**.md",
