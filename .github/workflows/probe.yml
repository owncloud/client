name: localhost probe
on:
  push:
  workflow_dispatch:
permissions: {}
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26, ubuntu-latest]
        pyside: ["==6.8.3", "~=6.9.0", "~=6.10.0", ""]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Plain sockets (blocking and non-blocking)
        run: |
          echo "macOS $(sw_vers -productVersion 2>/dev/null) image $ImageVersion"
          python3 - <<'PY'
          import socket, time, threading, selectors, errno
          s = socket.socket(); s.bind(("127.0.0.1", 0)); s.listen(); port = s.getsockname()[1]
          threading.Thread(target=lambda: [s.accept() for _ in range(8)], daemon=True).start()
          for fam, addr in ((socket.AF_INET6, "::1"), (socket.AF_INET, "127.0.0.1")):
              c = socket.socket(fam); c.settimeout(10); t = time.monotonic()
              try: c.connect((addr, port)); r = "connected"
              except Exception as e: r = repr(e)
              print(f"blocking connect {addr}: {r} {time.monotonic()-t:.3f}s")
              c = socket.socket(fam); c.setblocking(False); t = time.monotonic()
              rc = c.connect_ex((addr, port))
              sel = selectors.DefaultSelector(); sel.register(c, selectors.EVENT_WRITE)
              ev = sel.select(10)
              err = c.getsockopt(socket.SOL_SOCKET, socket.SO_ERROR)
              print(f"non-blocking connect {addr}: connect_ex={errno.errorcode.get(rc, rc)} writable={bool(ev)} SO_ERROR={errno.errorcode.get(err, err)} {time.monotonic()-t:.3f}s")
          PY
      - name: Qt probe
        run: |
          pip install -q "PySide6-Essentials${{ matrix.pyside }}"
          python -I scripts/repro.py
