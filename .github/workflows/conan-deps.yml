name: Conan dependencies

# Installs the locked Conan dependencies from the archives the GitLab dependency
# builder publishes to ghcr.io, with no credentials and no remote: proves that
# every built profile's binaries install here. Building the client with them
# replaces the Craft workflow later.

on:
  push:
    branches:
      - master
      - '7.2'
      - '6'
      - feat/conan-dependencies
    paths:
      - conanfile.py
      - conan.lock
      - conan/**
      - .github/workflows/conan-deps.yml
      - .github/actions/conan-deps/**
  pull_request:
    paths:
      - conanfile.py
      - conan.lock
      - conan/**
      - .github/workflows/conan-deps.yml
      - .github/actions/conan-deps/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conan-deps-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    name: Install linux-x86_64
    # No compiler runs (--build=never), so the runner need not match the GitLab builder image the
    # packages were built in (AlmaLinux 8, gcc-toolset-13); only the system packages below matter.
    # Once the client is compiled here, the archive's tool binaries (cmake, Qt host tools) run on the
    # runner: they need glibc >= 2.28 and gcc 8's libstdc++ (GLIBCXX_3.4.25) or newer, AlmaLinux 8's own;
    # gcc-toolset-13 links its newer libstdc++ parts statically, so it raises neither floor.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The PR head, not GitHub's merge commit: the dependency builder fingerprints the head.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install the system packages Conan checks
        # The profile has tools.system.package_manager:mode=check: the apt packages of xorg/system,
        # opengl/system, egl/system and xkeyboard-config/system at conan/recipes-commit must be there.
        run: |
          sudo apt-get update -qq
          # python3-venv: the action creates Conan's venv with python3, which Debian splits it from.
          # pkgconf: the system recipes' package_info() runs pkg-config.
          sudo apt-get install -y -qq --no-install-recommends \
            python3-venv \
            pkgconf \
            libx11-dev \
            libx11-xcb-dev \
            libfontenc-dev \
            libice-dev \
            libsm-dev \
            libxau-dev \
            libxaw7-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxdamage-dev \
            libxdmcp-dev \
            libxext-dev \
            libxfixes-dev \
            libxi-dev \
            libxinerama-dev \
            libxkbfile-dev \
            libxmu-dev \
            libxmuu-dev \
            libxpm-dev \
            libxrandr-dev \
            libxrender-dev \
            libxres-dev \
            libxss-dev \
            libxt-dev \
            libxtst-dev \
            libxv-dev \
            libxxf86vm-dev \
            libxcb-glx0-dev \
            libxcb-render0-dev \
            libxcb-render-util0-dev \
            libxcb-xkb-dev \
            libxcb-icccm4-dev \
            libxcb-image0-dev \
            libxcb-keysyms1-dev \
            libxcb-randr0-dev \
            libxcb-shape0-dev \
            libxcb-sync-dev \
            libxcb-xfixes0-dev \
            libxcb-xinerama0-dev \
            libxcb-dri3-dev \
            uuid-dev \
            libxcb-cursor-dev \
            libxcb-dri2-0-dev \
            libxcb-present-dev \
            libxcb-composite0-dev \
            libxcb-ewmh-dev \
            libxcb-res0-dev \
            libxcb-util-dev \
            libgl-dev \
            libegl-dev \
            xkb-data
      - uses: ./.github/actions/conan-deps
        with:
          profile: linux-x86_64
          python: python3

  macos:
    name: Install macos-armv8
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The PR head, not GitHub's merge commit: the dependency builder fingerprints the head.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Select Xcode with apple-clang 21
        run: |
          # conan/profiles/macos-armv8 says compiler.version=21.
          for app in /Applications/Xcode*.app; do
            major="$(DEVELOPER_DIR="$app/Contents/Developer" xcrun clang --version 2>/dev/null | sed -nE 's/^Apple clang version ([0-9]+).*/\1/p')"
            if [ "$major" = 21 ]; then
              sudo xcode-select -s "$app/Contents/Developer"
              xcrun clang --version | head -n 1
              exit 0
            fi
          done
          echo "::error::no Xcode with apple-clang 21 on this runner image"
          exit 1
      - uses: ./.github/actions/conan-deps
        with:
          profile: macos-armv8
          python: python3
