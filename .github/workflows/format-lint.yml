name: Format lint

# clang-format on the lines a change makes, without Craft, on the same events as Craft's build in
# main.yml. The QML format lint runs in the Linux job of conan-build.yml, with the qmlformat of the
# Qt the client builds against.

on:
  push:
    branches:
      - master
      - '[0-9]+'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: format-lint-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  clang-format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      # For a PR, GitHub's merge commit and its first parent, the base it was merged onto; for a
      # push, the new tip and its parent, which is often the commit the push started from. Hence
      # depth 2.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Find the base commit
        id: base
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          # The commit the change starts from: the merge commit's first parent for a PR, the
          # commit a push started from for a push. That one is fetched unless the clone has it; the
          # fetch has no credentials, so it fails on a private copy of the repository (or after a
          # force-push once GitHub has dropped the old commit), and then only the last commit is
          # checked. A manual run or the first push of a branch has no previous commit and checks
          # the last commit too.
          if [ "$EVENT" = pull_request ]; then
            ref=HEAD^1
          elif [ "$EVENT" = push ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            if git cat-file -e "$BEFORE^{commit}" 2> /dev/null || git fetch --no-tags --depth=1 origin "$BEFORE"; then
              ref="$BEFORE"
            else
              echo "::warning::cannot fetch $BEFORE, the commit the push started from; checking the last commit only"
              ref=HEAD^1
            fi
          else
            echo "::notice::no previous commit to compare with; checking the last commit"
            ref=HEAD^1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: python
        with:
          python-version: '3.12'
          update-environment: false
      - name: Install clang-format
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          # LLVM 20.1.7, the clang-format of Craft's libs/llvm that main.yml used.
          "$PYTHON" -m venv "$RUNNER_TEMP/clang-format"
          "$RUNNER_TEMP/clang-format/bin/pip" install --quiet clang-format==20.1.7
      - name: Check the format of the changed lines
        env:
          BASE: ${{ steps.base.outputs.ref }}
        run: |
          # git-clang-format and clang-format come from the venv; --diff prints what clang-format
          # would change and exits 1 if that is anything. --extensions: C, C++ and Objective-C only;
          # the defaults include json and ts, so clang-format would format Qt's .ts translations as
          # TypeScript and the JSON config files with the C++ style of .clang-format.
          PATH="$RUNNER_TEMP/clang-format/bin:$PATH" git clang-format --diff \
            --extensions c,cc,cpp,cxx,h,hpp,m,mm "$BASE"
