name: Format lint

# clang-format on the lines a change makes, without Craft, on the same events as Craft's build in
# main.yml. The QML format lint runs in the Linux job of conan-build.yml, with the qmlformat of the
# Qt the client builds against.

on:
  push:
    branches:
      - master
      - '[0-9]+'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: format-lint-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  clang-format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      # For a PR, GitHub's merge commit and its first parent, the base it was merged onto (hence
      # depth 2): the lines that differ between the two are the PR's.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Find the base commit
        id: base
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          # The commit the change starts from: the merge commit's first parent for a PR, or the
          # commit a push started from (a failed fetch of it fails the job). A manual run or the
          # first push of a branch has none, so it has no changed lines to check.
          if [ "$EVENT" = pull_request ]; then
            echo "ref=HEAD^1" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = push ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            git fetch --no-tags --depth=1 origin "$BEFORE"
            echo "ref=$BEFORE" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::no previous commit to compare with; nothing to check"
          fi
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.base.outputs.ref != ''
        id: python
        with:
          python-version: '3.12'
          update-environment: false
      - name: Install clang-format
        if: steps.base.outputs.ref != ''
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          # LLVM 20.1.7, the clang-format of Craft's libs/llvm that main.yml used.
          "$PYTHON" -m venv "$RUNNER_TEMP/clang-format"
          "$RUNNER_TEMP/clang-format/bin/pip" install --quiet clang-format==20.1.7
      - name: Check the format of the changed lines
        if: steps.base.outputs.ref != ''
        env:
          BASE: ${{ steps.base.outputs.ref }}
        run: |
          # git-clang-format and clang-format come from the venv; --diff prints what clang-format
          # would change and exits 1 if that is anything. --extensions: C, C++ and Objective-C only;
          # the defaults include json and ts, which here are config files and Qt translations, and
          # .clang-format has only a C++ style.
          PATH="$RUNNER_TEMP/clang-format/bin:$PATH" git clang-format --diff \
            --extensions c,cc,cpp,cxx,h,hpp,m,mm "$BASE"
