name: Install Conan dependencies from ghcr.io
description: >-
  Pulls the archive the GitLab dependency builder published for this commit's
  Conan inputs and profile, restores it and runs conan install with no remote
  and --build=never.

inputs:
  profile:
    description: A profile in conan/profiles.
    required: true
  python:
    description: The Python to run the fingerprint script and Conan's venv with.
    required: true
  generators-folder:
    description: >-
      If set, also generates CMakeDeps and CMakeToolchain there, to build the
      client against the dependencies. On the command line, not in
      conanfile.py, which is a fingerprint input.
    required: false
    default: ''
  cmake-generator:
    description: >-
      The CMake generator CMakeToolchain sets, e.g. Ninja, which the caller then
      has to provide. Empty: Conan's default for the platform.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Test the fingerprint script
      shell: bash
      env:
        PYTHON: ${{ inputs.python }}
      # As a script: `-m unittest conan/...` would import it as conan.test_fingerprint, which an
      # installed Conan package shadows.
      run: '"$PYTHON" conan/test_fingerprint.py'

    # Checks the download against its own SHA-256 table of the official releases.
    - uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3
      with:
        version: 1.3.6

    - uses: $/.github/actions/setup-conan
      id: conan
      with:
        python: ${{ inputs.python }}

    - name: Fetch the dependency archive
      shell: bash
      env:
        PROFILE: ${{ inputs.profile }}
        PYTHON: ${{ inputs.python }}
        DEPS_REPOSITORY: ghcr.io/owncloud/client-deps
      run: |
        # tr: a native Windows Python ends the line with CRLF, and $(...) strips only the LF.
        fp="$("$PYTHON" conan/fingerprint.py --profile "$PROFILE" --root . | tr -d '\r')"
        ref="$DEPS_REPOSITORY:$PROFILE-$fp"
        echo "archive: $ref"
        mkdir -p "$RUNNER_TEMP/deps"
        if ! oras pull --output "$RUNNER_TEMP/deps" "$ref" 2> "$RUNNER_TEMP/pull.err"; then
          cat "$RUNNER_TEMP/pull.err" >&2
          if grep -q ': not found' "$RUNNER_TEMP/pull.err"; then
            echo "::error::no dependency binaries for this commit's Conan inputs ($ref); the dependency builder has to publish them first. If the base branch changed the Conan inputs too, rebase the PR and have them built again"
          fi
          exit 1
        fi
        test -f "$RUNNER_TEMP/deps/cache.tgz"

    - name: Install the dependencies
      shell: bash
      env:
        PROFILE: ${{ inputs.profile }}
        PYTHON: ${{ inputs.python }}
        GENERATORS_FOLDER: ${{ inputs.generators-folder }}
        CMAKE_GENERATOR: ${{ inputs.cmake-generator }}
        CONAN_BIN_DIR: ${{ steps.conan.outputs.bin-dir }}
      run: |
        conan="$CONAN_BIN_DIR/conan"
        generators=()
        if [ -n "$GENERATORS_FOLDER" ]; then
          generators=(-g CMakeDeps -g CMakeToolchain --output-folder "$GENERATORS_FOLDER")
          if [ -n "$CMAKE_GENERATOR" ]; then
            generators+=(-c "tools.cmake.cmaketoolchain:generator=$CMAKE_GENERATOR")
          fi
          # PowerShell launchers too (conanbuild.ps1, conanrun.ps1, and conanvcvars.ps1 with
          # the MSVC environment), for pwsh steps: the workflows avoid shell: cmd.
          if [ "$RUNNER_OS" = Windows ]; then
            generators+=(-c tools.env.virtualenv:powershell=pwsh)
          fi
        fi
        "$conan" remote remove "*"
        "$conan" cache restore "$RUNNER_TEMP/deps/cache.tgz"
        # As the dependency builder built it: a cross-built profile (macos-x86_64) with its build
        # profile as -pr:b, so the build-context binaries are the archive's.
        build_profile="$("$PYTHON" conan/fingerprint.py --profile "$PROFILE" --print-build-profile)"
        if [ "$build_profile" = "$PROFILE" ]; then
          profiles=(-pr:a "conan/profiles/$PROFILE")
        else
          profiles=(-pr:h "conan/profiles/$PROFILE" -pr:b "conan/profiles/$build_profile")
          # macOS to macOS (macos-x86_64 on an arm64 Mac): the client itself (&:) is built
          # natively for the host arch, as Qt is (see the profile): no CMAKE_SYSTEM_NAME, so
          # CMake does not see a cross build (src/CMakeLists.txt adds -fstack-protector-strong
          # only then), and CMAKE_OSX_ARCHITECTURES still selects the arch. Set here, not in the
          # profile, which is a fingerprint input of the dependency archives.
          if grep -qx 'os=Macos' "conan/profiles/$PROFILE" && grep -qx 'os=Macos' "conan/profiles/$build_profile"; then
            profiles+=(-c "&:tools.build.cross_building:cross_build=False"
                       -c "&:tools.cmake.cmaketoolchain:system_name=")
          fi
        fi
        "$conan" install . --lockfile=conan.lock "${profiles[@]}" --build=never "${generators[@]}"
