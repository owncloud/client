name: Install Conan dependencies from ghcr.io
description: >-
  Pulls the archive the GitLab dependency builder published for this commit's
  Conan inputs and profile, restores it and runs conan install with no remote
  and --build=never.

inputs:
  profile:
    description: A profile in conan/profiles.
    required: true
  python:
    description: The Python to run the fingerprint script and Conan's venv with.
    required: true
  generators-folder:
    description: >-
      If set, also generates CMakeDeps and CMakeToolchain there, to build the
      client against the dependencies. On the command line, not in
      conanfile.py, which is a fingerprint input.
    required: false
    default: ''
  cmake-generator:
    description: >-
      The CMake generator CMakeToolchain sets, e.g. Ninja, which the caller then
      has to provide. Empty: Conan's default for the platform.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Test the fingerprint script
      shell: bash
      env:
        PYTHON: ${{ inputs.python }}
      # As a script: `-m unittest conan/...` would import it as conan.test_fingerprint, which an
      # installed Conan package shadows.
      run: $PYTHON conan/test_fingerprint.py

    # Checks the download against its own SHA-256 table of the official releases.
    - uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3
      with:
        version: 1.3.6

    - name: Install Conan
      shell: bash
      env:
        PYTHON: ${{ inputs.python }}
      run: |
        # The exact pin of conanfile.py's required_conan_version ("=2.x.y").
        version="$(sed -nE 's/^required_conan_version = "=([0-9]+\.[0-9]+\.[0-9]+)"$/\1/p' conanfile.py)"
        [ -n "$version" ] || { echo "::error::conanfile.py has no exact required_conan_version"; exit 1; }
        $PYTHON -m venv "$RUNNER_TEMP/conan"
        "$RUNNER_TEMP/conan/bin/pip" install --quiet "conan==$version"

    - name: Fetch the dependency archive
      shell: bash
      env:
        PROFILE: ${{ inputs.profile }}
        PYTHON: ${{ inputs.python }}
        DEPS_REPOSITORY: ghcr.io/owncloud/client-deps
      run: |
        fp="$($PYTHON conan/fingerprint.py --profile "$PROFILE" --root .)"
        ref="$DEPS_REPOSITORY:$PROFILE-$fp"
        echo "archive: $ref"
        mkdir -p "$RUNNER_TEMP/deps"
        if ! oras pull --output "$RUNNER_TEMP/deps" "$ref" 2> "$RUNNER_TEMP/pull.err"; then
          cat "$RUNNER_TEMP/pull.err" >&2
          if grep -q ': not found' "$RUNNER_TEMP/pull.err"; then
            echo "::error::no dependency binaries for this commit's Conan inputs; a maintainer has to label the PR deps:build (fork PRs: have a maintainer carry the change over); if the base branch changed them too, rebase the PR"
          fi
          exit 1
        fi
        test -f "$RUNNER_TEMP/deps/cache.tgz"

    - name: Install the dependencies
      shell: bash
      env:
        PROFILE: ${{ inputs.profile }}
        GENERATORS_FOLDER: ${{ inputs.generators-folder }}
        CMAKE_GENERATOR: ${{ inputs.cmake-generator }}
      run: |
        conan="$RUNNER_TEMP/conan/bin/conan"
        generators=()
        if [ -n "$GENERATORS_FOLDER" ]; then
          generators=(-g CMakeDeps -g CMakeToolchain --output-folder "$GENERATORS_FOLDER")
          if [ -n "$CMAKE_GENERATOR" ]; then
            generators+=(-c "tools.cmake.cmaketoolchain:generator=$CMAKE_GENERATOR")
          fi
        fi
        "$conan" remote remove "*"
        "$conan" cache restore "$RUNNER_TEMP/deps/cache.tgz"
        "$conan" install . --lockfile=conan.lock -pr:a "conan/profiles/$PROFILE" --build=never "${generators[@]}"
