name: Install the pinned Conan
description: >-
  Installs the exact Conan version that conanfile.py pins with
  required_conan_version, with conan-io/setup-conan, into a venv in
  $RUNNER_TEMP/conan, and puts the venv's folder of executables (bin/ on Linux
  and macOS, Scripts\ on Windows) on PATH for the rest of the job.

inputs:
  python:
    description: The Python to create Conan's venv with.
    required: true

runs:
  using: composite
  steps:
    # conan-io/setup-conan runs whatever `python` is on PATH, and the macOS runners have none (only
    # Homebrew's python3). So the venv is created here with the given Python, and only its bin/
    # goes on PATH, not the environment of setup-python (see conan-build.yml). The action's
    # `python -m pip install` is then the venv's, and installs Conan into it.
    - name: Create Conan's venv
      id: venv
      shell: bash
      env:
        PYTHON: ${{ inputs.python }}
      run: | # zizmor: ignore[github-env]
        # The exact pin of conanfile.py's required_conan_version ("=2.x.y").
        version="$(sed -nE 's/^required_conan_version = "=([0-9]+\.[0-9]+\.[0-9]+)"$/\1/p' conanfile.py)"
        [ -n "$version" ] || { echo "::error::conanfile.py has no exact required_conan_version"; exit 1; }
        "$PYTHON" -m venv "$RUNNER_TEMP/conan"
        # A Windows venv has Scripts\ where the others have bin/.
        if [ "$RUNNER_OS" = Windows ]; then
          bin_dir="$RUNNER_TEMP/conan/Scripts"
        else
          bin_dir="$RUNNER_TEMP/conan/bin"
        fi
        # A fixed folder under $RUNNER_TEMP, nothing a pull request controls (zizmor github-env
        # ignored); setup-conan's own use_venv writes the same.
        echo "$bin_dir" >> "$GITHUB_PATH"
        echo "version=$version" >> "$GITHUB_OUTPUT"
        # The action upgrades pip to the latest release first. A constraint on the venv's own pip
        # makes that a no-op.
        pip_version="$("$bin_dir/python" -m pip --version | cut -d' ' -f2 | tr -d '\r')"
        echo "pip==$pip_version" > "$RUNNER_TEMP/conan-pip-constraint.txt"
        echo "pip-version=$pip_version" >> "$GITHUB_OUTPUT"

    # The action expands the version into its shell scripts unquoted; the sed above lets only
    # digits and dots through. No profile detection: the jobs use conan/profiles. No package
    # cache: the dependencies come from ghcr.io (see conan-deps).
    - uses: conan-io/setup-conan@2c7f599b76d52302b8e122bf890878e696d4577b # v1.5.1
      env:
        PIP_CONSTRAINT: ${{ runner.temp }}/conan-pip-constraint.txt
      with:
        version: ${{ steps.venv.outputs.version }}
        use_venv: 'false'
        profile_detect: 'false'

    - name: Check Conan and pip
      shell: bash
      env:
        VERSION: ${{ steps.venv.outputs.version }}
        PIP_VERSION: ${{ steps.venv.outputs.pip-version }}
      run: |
        # conan and pip on PATH have to be the venv's: the pinned Conan and the bundled pip. tr: a
        # native Windows Python ends the line with CRLF, and $(...) strips only the LF.
        conan --version
        [ "$(conan --version | tr -d '\r')" = "Conan version $VERSION" ] || { echo "::error::conan on PATH ($(command -v conan)) is not Conan $VERSION from the venv"; exit 1; }
        [ "$(python -m pip --version | cut -d' ' -f2 | tr -d '\r')" = "$PIP_VERSION" ] || { echo "::error::pip of python on PATH ($(command -v python)) is not the venv's pip $PIP_VERSION: not the venv's python, or setup-conan upgraded pip despite the constraint"; exit 1; }
